name: Scaleway Build Connectivity Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: scaleway-internal-poc
    steps:
      - uses: actions/checkout@v6
      - name: Build and push the probe to the existing Scaleway registry
        env:
          REGISTRY_ENDPOINT: ${{ vars.SCW_REGISTRY_ENDPOINT }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REGISTRY_ENDPOINT"
          test -n "$SCW_SECRET_KEY"
          # endpoint from Terraform output; no URL scheme or trailing slash.
          printf '%s' "$SCW_SECRET_KEY" | docker login "${REGISTRY_ENDPOINT%%/*}" --username nologin --password-stdin
          image="$REGISTRY_ENDPOINT/connectivity:$GITHUB_SHA"
          docker build --platform linux/amd64 -t "$image" tools/connectivity-probe
          docker push "$image"
          echo "Set container_mode=connectivity and container_image=$image in SCW_TFVARS_JSON." >> "$GITHUB_STEP_SUMMARY"
      - name: Log out
        if: always()
        env:
          REGISTRY_ENDPOINT: ${{ vars.SCW_REGISTRY_ENDPOINT }}
        run: docker logout "${REGISTRY_ENDPOINT%%/*}"
